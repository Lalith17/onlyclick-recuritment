events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        # Least connections load balancing
        least_conn;

        # Define servers with health checks
        server localhost:5000 max_fails=3 fail_timeout=30s;
        server localhost:5001 max_fails=3 fail_timeout=30s;
        server localhost:5002 max_fails=3 fail_timeout=30s;

        # Enable sticky sessions using IP hash
        ip_hash;

        # Keep alive connections
        keepalive 32;
    }

    # HTTP server
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'healthy\n';
        }

        # Main application
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Additional headers for security
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable CORS
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
} 
